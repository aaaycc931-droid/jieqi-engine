name: Verify rules and web build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rules-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run complete rule suite and build the WebView assets
        run: node --test --test-reporter=spec tests/*.test.ts && node scripts/build-web.ts && node android/scripts/sync-web-assets.mjs

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and sync the current WebView assets
        run: node scripts/build-web.ts && node android/scripts/sync-web-assets.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the declared Android SDK components
        run: |
          sdkmanager_path="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses
          "$sdkmanager_path" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Assemble the offline Bluetooth APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Keep the debug APK for two-phone testing
        uses: actions/upload-artifact@v4
        with:
          name: jieqi-bluetooth-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
